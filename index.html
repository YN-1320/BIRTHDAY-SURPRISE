<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter Password 💖</title>

<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fecfef);
  font-family: Poppins, sans-serif;
}

.box {
  background: rgba(255,255,255,0.2);
  padding: 2rem;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  text-align: center;
  border: 1px solid rgba(255,255,255,0.5);
}

input {
  padding: 1rem;
  width: 80%;
  border-radius: 10px;
  border: none;
  outline: none;
  margin-top: 1rem;
}

button {
  margin-top: 1.5rem;
  padding: 1rem 2rem;
  border-radius: 50px;
  border: none;
  background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
  color: #fff;
  cursor: pointer;
  font-size: 1rem;
}

button:hover {
  transform: scale(1.05);
}

h2 {
  color: #fff;
  font-size: 2rem;
}
</style>
</head>

<body>
<div class="box">
  <h2>Enter Password 💖</h2>
  <input type="password" id="passwordInput" placeholder="Your Password...">
  <br>
  <button onclick="checkPass()">Enter</button>
  <p id="error" style="color:red; margin-top:1rem;"></p>
</div>

<script>
function checkPass() {
    let entered = document.getElementById("passwordInput").value;
    let correct = "YN FOREVER❤️♾️";  // 👉 set your password here

    if (entered === correct) {
       window.location.href = "home.html";

    } else {
        document.getElementById("error").innerText = "Incorrect Password 💔";
    }
}
</script>
</body>
</html>
