<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Viewer</title>

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .story-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    video {
      height: 100vh;
      width: auto;
      max-width: 100vw;
      object-fit: cover;
    }

    .progress-wrapper {
      position: absolute;
      top: 20px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 10px;
      overflow: hidden;
    }
 #replayContainer { position: absolute; bottom: 40px; width: 100%; text-align: center; display: none; z-index: 200; }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width 0.1s linear;
    }

  </style>
</head>
<body>

<div class="story-container">

  <!-- Progress bars -->
  <div class="progress-wrapper">
    <div class="progress-bar"><div class="progress-fill" id="p1"></div></div>
    <div class="progress-bar"><div class="progress-fill" id="p2"></div></div>
  </div>

  <!-- Video player -->
  <video id="player" playsinline autoplay></video>

</div>
   <div id="replayContainer">
    <a href="home.html"><button class="btn">🔄 Replay Journey</button></a>
  </div>


<script>
const videos = [
  {
    src: "https://raw.githubusercontent.com/YN-1320/BIRTHDAY-VIDEOS/refs/heads/main/VIDEO%201.mp4",
    duration: 30
  },
  {
    src: "https://raw.githubusercontent.com/YN-1320/BIRTHDAY-VIDEO-2/refs/heads/main/VIDEO%202.mp4",
    duration: 55
  }
];

let current = 0;
const player = document.getElementById("player");
const p1 = document.getElementById("p1");
const p2 = document.getElementById("p2");

function playVideo(index) {
  current = index;
  player.src = videos[index].src;
  player.play();

  let bar = index === 0 ? p1 : p2;
  bar.style.width = "0%";

  let start = Date.now();
  let duration = videos[index].duration * 1000;

  let timer = setInterval(() => {
    if (current !== index) return clearInterval(timer);

    let percent = ((Date.now() - start) / duration) * 100;
    bar.style.width = percent + "%";

    if (percent >= 100) {
      clearInterval(timer);
      if (current < videos.length - 1) {
        playVideo(current + 1);
      }
    }
  }, 100);
}

playVideo(0);
</script>

</body>
</html>
