<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Viewer</title>

  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .story-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    video {
      height: 100vh;
      width: auto;
      max-width: 100vw;
      object-fit: cover;
    }

    .progress-wrapper {
      position: absolute;
      top: 20px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
      z-index: 20;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 10px;
      overflow: hidden;
    }
      .story-caption { position: absolute; top: 45px; width: 100%; text-align: center; color: white; font-size: 22px; font-weight: bold; z-index: 40; text-shadow: 2px 2px 6px rgba(0,0,0,0.6);}

        /* Buttons */
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            margin: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            z-index: 10;
            outline: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            background: linear-gradient(45deg, #ff5252, #26c6da);
        }

        .btn:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }


 #replayContainer {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      display: none;
      z-index: 200;
    }
    button {
  margin-top: 1.5rem;
  padding: 1rem 2rem;
  border-radius: 50px;
  border: none;
  background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
  color: #fff;
  cursor: pointer;
  font-size: 1rem;
}

button:hover {
  transform: scale(1.05);


    .progress-fill {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width 0.1s linear;
    }

  </style>
</head>
<body>

<div class="story-container">

  <!-- Progress bars -->
  <div class="progress-wrapper">
    <div class="progress-bar"><div class="progress-fill" id="p1"></div></div>
    <div class="progress-bar"><div class="progress-fill" id="p2"></div></div>
  </div>
 <div class="story-caption" id="caption">HAPPY BIRTHDAY MY LOVE❤️😘</div>

  <!-- Video player -->
  <video id="player" playsinline autoplay></video>

</div>
   <div id="replayContainer">
    <a href="home.html"><button class="btn">🔄 Replay Journey</button></a>
  </div>


<script>
const videos = [
  {
    src: "https://raw.githubusercontent.com/YN-1320/BIRTHDAY-VIDEOS/refs/heads/main/VIDEO%201.mp4",
    duration: 17
  },
  {
    src: "https://raw.githubusercontent.com/YN-1320/BIRTHDAY-VIDEO-2/refs/heads/main/VIDEO%202.mp4",
    duration: 40
  }
];

let current = 0;
const player = document.getElementById("player");
const p1 = document.getElementById("p1");
const p2 = document.getElementById("p2");

function playVideo(index) {
  current = index;
  player.src = videos[index].src;
  player.play();

  let bar = index === 0 ? p1 : p2;
  bar.style.width = "0%";

  let start = Date.now();
  let duration = videos[index].duration * 1000;

let timer = setInterval(() => {
    if (current !== index) return clearInterval(timer);

    let percent = ((Date.now() - start) / duration) * 100;
    bar.style.width = percent + "%";

    if (percent >= 100) {
      clearInterval(timer);
      if (current < videos.length - 1) {
        playVideo(current + 1);
      } else {
        document.getElementById("replayContainer").style.display = "block";
      }
    }
  }, 100);
}
playVideo(0);
</script>

</body>
</html>
