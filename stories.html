<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Story Viewer</title>

  <style>
    body { margin: 0; background: #000; font-family: Arial, sans-serif; }

    .story-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;      /* IG Story effect */
      object-position: center;
    }

    .progress-wrapper {
      position: absolute;
      top: 20px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
      z-index: 50;
    }
    .progress-bar { flex:1; height:4px; background:rgba(255,255,255,0.3); border-radius:10px; overflow:hidden; }
    .progress-fill { width:0%; height:100%; background:white; }

    .story-caption {
      position:absolute; top:45px; width:100%;
      text-align:center; color:white; font-size:22px; font-weight:bold;
      text-shadow:2px 2px 6px rgba(0,0,0,0.6);
      z-index:40;
    }

    .touch-left, .touch-right {
      position:absolute; top:0; bottom:0; width:50%; z-index:100;
    }
    .touch-left { left:0; }
    .touch-right { right:0; }

    #viewOverlay {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.85); display:flex; justify-content:center; align-items:center;
      z-index:99999;
    }
    .btn {
      background:linear-gradient(45deg,#ff6b6b,#4ecdc4); border:none;
      padding:1.2rem 3rem; font-size:1.8rem;
      color:white; border-radius:50px; cursor:pointer;
    }
  </style>
</head>
<body>

<!-- First click → enables sound -->
<div id="viewOverlay">
  <button id="viewButton" class="btn">👀 View</button>
</div>

<div class="story-container">

  <div class="progress-wrapper">
    <div class="progress-bar"><div class="progress-fill" id="p1"></div></div>
    <div class="progress-bar"><div class="progress-fill" id="p2"></div></div>
  </div>

  <div class="story-caption" id="caption">HAPPY BIRTHDAY MY LOVE ❤️😘</div>

  <video id="storyVideo" playsinline></video>

  <div class="touch-left" id="tapLeft"></div>
  <div class="touch-right" id="tapRight"></div>
</div>

<script>
const videos = [
  {
    src: "https://www.dropbox.com/scl/fi/sgf2swyp28ys0szhag92i/VIDEO-1.mp4?rlkey=mbd55cnr075xmsewmz5uhljub&raw=1",
    caption: "HAPPY BIRTHDAY MY LOVE ❤️😘",
    duration: 18
  },
  {
    src: "https://www.dropbox.com/scl/fi/cnbfhx7lv9b40dtweyesv/VIDEO-2.mp4?rlkey=3za7i3gjokn5eec9iaacy3ww2&raw=1",
    caption: "HAPPY BIRTHDAY MY LOVE ❤️😘",
    duration: 40
  }
];

let current = 0;
const video = document.getElementById("storyVideo");
const caption = document.getElementById("caption");
const p1 = document.getElementById("p1");
const p2 = document.getElementById("p2");

function playStory(i) {
  current = i;

  video.src = videos[i].src;
  caption.textContent = videos[i].caption;

  video.currentTime = 0;
  video.muted = false;
  video.play();

  p1.style.width = i === 0 ? "0%" : "100%";
  p2.style.width = i === 1 ? "0%" : "100%";

  let bar = i === 0 ? p1 : p2;
  bar.style.width = "0%";

  let start = Date.now();
  let duration = videos[i].duration;

  let int = setInterval(() => {
    if (current !== i) return clearInterval(int);

    let percent = ((Date.now() - start) / 1000 / duration) * 100;

    if (percent >= 100) {
      bar.style.width = "100%";
      clearInterval(int);
      nextStory();
    } else {
      bar.style.width = percent + "%";
    }
  }, 100);
}

function nextStory() {
  if (current < videos.length - 1) playStory(current + 1);
}
function prevStory() {
  if (current > 0) playStory(current - 1);
}

document.getElementById("tapRight").onclick = nextStory;
document.getElementById("tapLeft").onclick = prevStory;

document.getElementById("viewButton").onclick = () => {
  document.getElementById("viewOverlay").style.display = "none";
  video.muted = false;
  playStory(0);
};
</script>

</body>
</html>
