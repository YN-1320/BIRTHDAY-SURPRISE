<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Story Viewer</title>
  <style>
    body { margin: 0; background: #000; font-family: Arial, sans-serif; }

    .story-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    video.story-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      position: absolute;
      top: 0;
      left: 0;
    }

    .progress-wrapper {
      position: absolute;
      top: 20px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
      z-index: 50;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: white;
      transition: width 0.1s linear;
    }

    .story-caption {
      position: absolute;
      top: 45px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 22px;
      font-weight: bold;
      z-index: 40;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }

    .touch-left, .touch-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 100;
    }

    .touch-left { left: 0; }
    .touch-right { right: 0; }

    #replayContainer {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      display: none;
      z-index: 200;
    }

    .btn {
      background: linear-gradient(45deg,#ff6b6b,#4ecdc4);
      border:none;
      padding:1rem 2rem;
      font-size:1.2rem;
      color:white;
      border-radius:50px;
      cursor:pointer;
      margin:1rem;
      transition:all 0.3s ease;
      box-shadow:0 4px 15px rgba(0,0,0,0.2);
      z-index:9999;
    }

    .btn:hover {
      transform:translateY(-3px);
      box-shadow:0 6px 20px rgba(0,0,0,0.3);
      background:linear-gradient(45deg,#ff5252,#26c6da);
    }
  </style>
</head>

<body>

<div class="story-container" id="storyContainer">
  <div class="progress-wrapper">
    <div class="progress-bar"><div class="progress-fill" id="p1"></div></div>
    <div class="progress-bar"><div class="progress-fill" id="p2"></div></div>
  </div>

  <div class="story-caption" id="caption">HAPPY BIRTHDAY MY LOVE❤️😘</div>

  <video id="storyVideo" class="story-video" playsinline></video>

  <div class="touch-left" id="tapLeft"></div>
  <div class="touch-right" id="tapRight"></div>

  <div id="replayContainer">
    <a href="home.html"><button class="btn">🔄 Replay Journey</button></a>
  </div>
</div>

<script>
const stories = [
  {
    url: "https://www.dropbox.com/scl/fi/sgf2swyp28ys0szhag92i/VIDEO-1.mp4?raw=1",
    caption: "HAPPY BIRTHDAY MY LOVE❤️😘",
    duration: 18
  },
  {
    url: "https://www.dropbox.com/scl/fi/cnbfhx7lv9b40dtweyesv/VIDEO-2.mp4?raw=1",
    caption: "HAPPY BIRTHDAY MY LOVE❤️😘",
    duration: 40
  }
];

let current = 0;
const p1 = document.getElementById("p1");
const p2 = document.getElementById("p2");
const caption = document.getElementById("caption");
const replayContainer = document.getElementById("replayContainer");
const storyVideo = document.getElementById("storyVideo");

function playStory(index) {
  current = index;
  replayContainer.style.display = "none";

  storyVideo.src = stories[index].url;
  storyVideo.currentTime = 0;
  storyVideo.play();

  caption.textContent = stories[index].caption;

  p1.style.width = index === 0 ? "0%" : "100%";
  p2.style.width = index === 1 ? "0%" : "100%";

  let bar = current === 0 ? p1 : p2;
  bar.style.width = "0%";

  let duration = stories[index].duration;
  let startTime = Date.now();

  let interval = setInterval(() => {
    if (current !== index) return clearInterval(interval);

    let percent = ((Date.now() - startTime) / 1000) / duration * 100;

    if (percent >= 100) {
      bar.style.width = "100%";
      clearInterval(interval);
      nextStory();
    } else {
      bar.style.width = percent + "%";
    }
  }, 100);
}

function nextStory() {
  if (current < stories.length - 1) {
    playStory(current + 1);
  } else {
    replayContainer.style.display = "block";
  }
}

function previousStory() {
  if (current > 0) {
    replayContainer.style.display = "none";
    playStory(current - 1);
  }
}

document.getElementById("tapRight").addEventListener("click", nextStory);
document.getElementById("tapLeft").addEventListener("click", previousStory);

playStory(0); // auto start
</script>

</body>
</html>
